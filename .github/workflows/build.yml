name: Build and publish

# Only on pushes that land on main (not every branch/PR - publishing is a
# side effect real pushes should have, not something a PR run should do) and
# on version tags, so a release can be cut without waiting for main to move.
on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions: {}

jobs:
  # Version and registry names shared by every image and the chart, computed
  # once up front so the image builds below don't depend on each other and
  # can all run in parallel.
  meta:
    name: Compute version and names
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.names.outputs.image }}
      chart-repo: ${{ steps.names.outputs.chart-repo }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A single, unprefixed version used by both the image tags and the Helm
      # chart's version/appVersion below, so they always describe the same
      # build: the short commit SHA on every push to main, or the tag with
      # its leading "v" stripped (chart versions must be plain SemVer) on a
      # version tag push.
      - name: Compute the version for this build
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-main.$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # GHCR requires an all-lowercase path; github.repository preserves
      # whatever case the repo owner/name actually use (this one has an
      # uppercase letter), so it can't be used directly.
      - name: Compute lowercase image/chart names
        id: names
        run: |
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          echo "chart-repo=ghcr.io/${repo}-charts" >> "$GITHUB_OUTPUT"

  # The operator, the apiserver (web UI + kubectl shell) and the
  # single-container appliance, all published under the same version as the
  # chart: the appliance installs exactly that operator chart/image and
  # apiserver image (VERSION/IMAGE_REPO build args, baked in as strings -
  # nothing is pulled at build time), so one appliance tag always pins one
  # akbench build and the three builds can run side by side.
  images:
    name: Build and push the ${{ matrix.name }} image
    needs: meta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: operator
            dockerfile: Dockerfile
            suffix: ""
          - name: apiserver
            dockerfile: Dockerfile.apiserver
            suffix: -apiserver
          - name: appliance
            dockerfile: Dockerfile.appliance
            suffix: -appliance
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Derive image tags/labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ needs.meta.outputs.image }}${{ matrix.suffix }}
          tags: |
            type=raw,value=${{ needs.meta.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            IMAGE_REPO=${{ needs.meta.outputs.image }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  chart:
    name: Package and push the Helm chart
    # Waits for the images so a published chart never points at an
    # appVersion tag that doesn't exist yet.
    needs: [meta, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Regenerated rather than trusting the checked-in copy: guarantees the
      # published chart's CRDs/RBAC always match this exact commit's API
      # types, the same way `make manifests` already keeps config/crd in
      # sync in CI's test job. The chart's default image reference comes
      # from config/manager/kustomization.yaml (ghcr.io/.../akbench:latest)
      # - not repointed at this build's own version-pinned tag, so a plain
      # `helm install` always tracks latest unless the caller overrides
      # image.tag, the same way most operator charts default to :latest.
      - name: Regenerate the chart from config/default
        run: make helm-chart

      - name: Set chart version/appVersion to match the image just published
        run: |
          sed -i "s/^version: .*/version: ${{ needs.meta.outputs.version }}/" charts/authentik-bench-operator/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${{ needs.meta.outputs.version }}\"/" charts/authentik-bench-operator/Chart.yaml

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Log in to GHCR
        run: helm registry login ghcr.io --username ${{ github.actor }} --password-stdin <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: Package and push
        run: |
          helm package charts/authentik-bench-operator --destination /tmp
          helm push "/tmp/authentik-bench-operator-${{ needs.meta.outputs.version }}.tgz" "oci://${{ needs.meta.outputs.chart-repo }}"
