version: 2
# Chart repositories the helm update below reads. Dependabot's network proxy
# blocks hosts it doesn't know, so every repository in
# internal/render/deps/Chart.yaml it doesn't already allow is declared here.
registries:
  flannel:
    type: helm-registry
    url: https://flannel-io.github.io/flannel
  kubernetes:
    type: helm-registry
    url: https://kubernetes.github.io/autoscaler
  grafana-community:
    type: helm-registry
    url: https://grafana-community.github.io/helm-charts
updates:
- package-ecosystem: gomod
  directory: "/"
  schedule:
    interval: daily
    time: "04:00"
  open-pull-requests-limit: 10
  assignees:
  - BeryJu
- package-ecosystem: docker
  directory: "/"
  schedule:
    interval: daily
    time: "04:00"
  open-pull-requests-limit: 10
  assignees:
  - BeryJu
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: daily
    time: "04:00"
  open-pull-requests-limit: 10
  assignees:
  - BeryJu
- package-ecosystem: "npm"
  directory: "/web/ui"
  schedule:
    interval: daily
    time: "04:00"
  open-pull-requests-limit: 10
  assignees:
  - BeryJu
# Charts and images the operator installs onto workload clusters
# (internal/render/deps, embedded by internal/render/deps.go).
- package-ecosystem: helm
  directory: "/internal/render/deps"
  registries:
  - flannel
  - kubernetes
  - grafana-community
  schedule:
    interval: daily
    time: "04:00"
  open-pull-requests-limit: 10
  assignees:
  - BeryJu
  ignore:
  # Must match the authentik chart's default postgresql.image major.
  - dependency-name: "postgres"
    update-types: ["version-update:semver-major"]
