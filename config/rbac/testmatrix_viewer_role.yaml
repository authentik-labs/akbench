# This rule is not used by the project authentik-bench itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to bench.goauthentik.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: authentik-bench
    app.kubernetes.io/managed-by: kustomize
  name: testmatrix-viewer-role
rules:
- apiGroups:
  - bench.goauthentik.io
  resources:
  - testmatrices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - bench.goauthentik.io
  resources:
  - testmatrices/status
  verbs:
  - get
