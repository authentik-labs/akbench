                  rule: has(self.name) && self.name != ''
              namespace:
                description: |-
                  namespace is the namespace this deployment is installed into on the
                  target cluster.
                type: string
              placement:
                description: |-
                  PlacementSpec controls pod scheduling for an AuthentikDeployment's server and
                  worker pods.
                properties:
                  mode:
                    default: Default
                    description: mode selects Default (shared nodes) or Dedicated
                      (one pod per node).
                    enum:
                    - Default
                    - Dedicated
                    - Packed
                    type: string
                  nodeSelector:
                    additionalProperties:
                      type: string
                    description: nodeSelector is applied to server/worker pods in
                      Dedicated mode.
                    type: object
                  tolerations:
                    description: |-
                      tolerations are applied to server/worker pods in Dedicated mode, so
                      they can land on tainted, dedicated nodes.
                    items:
                      description: |-
                        The pod this Toleration is attached to tolerates any taint that matches
                        the triple <key,value,effect> using the matching operator <operator>.
                      properties:
                        effect:
                          description: |-
                            Effect indicates the taint effect to match. Empty means match all taint effects.
                            When specified, allowed values are NoSchedule, PreferNoSchedule and NoExecute.
                          type: string
                        key:
                          description: |-
                            Key is the taint key that the toleration applies to. Empty means match all taint keys.
                            If the key is empty, operator must be Exists; this combination means to match all values and all keys.
                          type: string
                        operator:
                          description: |-
                            Operator represents a key's relationship to the value.
                            Valid operators are Exists, Equal, Lt, and Gt. Defaults to Equal.
                            Exists is equivalent to wildcard for value, so that a pod can
                            tolerate all taints of a particular category.
                            Lt and Gt perform numeric comparisons (requires feature gate TaintTolerationComparisonOperators).
                          type: string
                        tolerationSeconds:
                          description: |-
                            TolerationSeconds represents the period of time the toleration (which must be
                            of effect NoExecute, otherwise this field is ignored) tolerates the taint. By default,
                            it is not set, which means tolerate the taint forever (do not evict). Zero and
                            negative values will be treated as 0 (evict immediately) by the system.
                          format: int64
                          type: integer
                        value:
                          description: |-
                            Value is the taint value the toleration matches to.
                            If the operator is Exists, the value should be empty, otherwise just a regular string.
                          type: string
                      type: object
                    type: array
                  topologyKey:
                    default: kubernetes.io/hostname
                    description: topologyKey is the anti-affinity deployment key used
                      in Dedicated mode.
                    type: string
                type: object
              postgres:
                description: |-
                  PostgresSpec selects and configures one of the three benchmarked Postgres
                  backends.
                properties:
                  cnpg:
                    description: |-
                      CNPGPostgresSpec configures a CloudNativePG Cluster provisioned for this
                      deployment.
                    properties:
                      instances:
                        default: 3
                        description: instances is the number of CNPG cluster instances
                          (>1 for HA).
                        format: int32
                        minimum: 1
                        type: integer
                      maxStorageSize:
                        description: |-
                          maxStorageSize caps volume auto-growth: once the postgres volume is
                          more than 80% full, the operator grows it by half its size, up to this
                          limit (12Gi when unset). Needs a StorageClass with
                          allowVolumeExpansion.
                        type: string
                      storageClassName:
                        type: string
                      storageSize:
                        type: string
                    type: object
                  embedded:
                    description: |-
                      EmbeddedPostgresSpec configures the authentik chart's bundled postgresql
                      subchart.
                    properties:
                      maxStorageSize:
                        description: |-
                          maxStorageSize caps volume auto-growth: once the postgres volume is
                          more than 80% full, the operator grows it by half its size, up to this
                          limit (12Gi when unset). Needs a StorageClass with
                          allowVolumeExpansion.
                        type: string
                      storageClassName:
                        type: string
                      storageSize:
                        type: string
                      tls:
                        description: |-
                          tls serves the bundled postgresql over TLS with a self-signed,
                          chart-generated certificate, and has authentik connect with
                          sslmode=require.
                        type: boolean
                    type: object
                  external:
                    description: ExternalPostgresSpec points at an operator-unmanaged
                      Postgres instance.
                    properties:
                      secretRef:
                        description: |-
                          secretRef names a Secret on the target cluster with host/port/database/
                          username/password keys.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      sslMode:
                        default: require
                        type: string
                    required:
                    - secretRef
                    type: object
                  mode:
                    default: Embedded
                    description: |-
                      PostgresMode selects which of the three benchmarked Postgres backends an
                      AuthentikDeployment uses.
                    enum:
                    - Embedded
                    - CNPG
                    - External
                    type: string
                type: object
              server:
                description: |-
                  WorkloadSpec sizes one of the authentik chart's workloads (server or
                  worker).
                properties:
                  replicas:
                    default: 1
                    format: int32
                    minimum: 1
                    type: integer
                  resources:
                    description: ResourceRequirements describes the compute resource
                      requirements.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                type: object
              targetName:
                description: |-
                  targetName is the identity this deployment is known by everywhere else:
                  the `target` label Prometheus attaches to its metrics, and the `target`
                  a TestCase names. Defaults to metadata.name.
                type: string
              worker:
                description: |-
                  WorkloadSpec sizes one of the authentik chart's workloads (server or
                  worker).
                properties:
                  replicas:
                    default: 1
                    format: int32
                    minimum: 1
                    type: integer
                  resources:
                    description: ResourceRequirements describes the compute resource
                      requirements.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                type: object
            required:
            - clusterRef
            - namespace
            - postgres
            - server
            - worker
            type: object
          status:
            description: AuthentikDeploymentStatus defines the observed state of AuthentikDeployment.
            properties:
              chartVersion:
                description: |-
                  chartVersion is the authentik chart version helm-controller installed.
                  With spec.chart.version unset, the HelmRelease stays on this version
                  rather than following new upstream chart releases (which would restart
                  authentik mid-benchmark).
                type: string
              cnpgClusterRef:
                description: |-
                  LocalObjectReference contains enough information to let you locate the
                  referenced object inside the same namespace.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              conditions:
                description: conditions report Ready, PostgresReady and HelmReleaseReady.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              helmReleaseRef:
                description: |-
                  LocalObjectReference contains enough information to let you locate the
                  referenced object inside the same namespace.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: |-
                  phase summarizes the Ready condition at a glance - computed from
                  conditions, never set independently. See ReconcilePhase.
                enum:
                - Pending
                - Reconciling
                - Ready
                - Failed
                - Archived
                type: string
              postgresStorage:
                description: |-
                  postgresStorage tracks the postgres volumes while maxStorageSize
                  auto-growth is on.
                properties:
                  capacityBytes:
                    format: int64
                    type: integer
                  lastChecked:
                    description: lastChecked is when usage was last read.
                    format: date-time
                    type: string
                  size:
                    description: |-
                      size is what the operator has grown the postgres volumes to, if it
                      has grown them at all. It never shrinks back to spec's storageSize:
                      a PVC can't be shrunk.
                    type: string
                  usedBytes:
                    description: |-
                      usedBytes and capacityBytes are the fullest postgres volume's
                      filesystem usage, as its node's kubelet reported it.
                    format: int64
                    type: integer
                type: object
              serviceEndpoint:
                description: |-
                  serviceEndpoint is the in-cluster host:port a TestCase drives, e.g.
                  <release>-server.<namespace>.svc.cluster.local:80.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must be no more than 41 characters
          optionalOldSelf: true
          rule: oldSelf.hasValue() || size(self.metadata.name) <= 41
