                  itself.
                properties:
                  errorReporting:
                    description: |-
                      ErrorReportingSpec mirrors authentik's error_reporting config section, used
                      both for Sentry (released images) and for OTLP export (the
                      goauthentik/authentik#25412 branch). On by default.
                    properties:
                      enabled:
                        default: true
                        description: |-
                          enabled is a pointer so an explicit false survives omitempty; nil
                          (including a spec with no authentik/errorReporting at all, where the
                          CRD default never applies) means enabled.
                        type: boolean
                      sampleRate:
                        default: "0.1"
                        type: string
                      tracingEndpoint:
                        description: tracingEndpoint is the OTLP base endpoint spans
                          are exported to.
                        type: string
                    type: object
                  extraValuesRef:
                    description: |-
                      extraValuesRef names a ConfigMap (a "values.yaml" key) merged over the
                      generated Helm values last, as an escape hatch.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  image:
                    default: ghcr.io/goauthentik/server
                    type: string
                  logLevel:
                    type: string
                  pyroscopeHost:
                    description: pyroscopeHost is where authentik sends continuous
                      profiles.
                    type: string
                  tag:
                    type: string
                type: object
              chart:
                description: |-
                  ChartSpec pins the authentik Helm chart source used to install this
                  deployment.
                properties:
                  repo:
                    default: https://charts.goauthentik.io
                    type: string
                  version:
                    type: string
                type: object
              clusterRef:
                description: |-
                  clusterRef names a cluster.x-k8s.io/v1beta1 Cluster this deployment is
                  deployed onto. Deploying onto the management cluster itself is not
                  allowed.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
                x-kubernetes-validations:
                - message: clusterRef.name must name a workload cluster; deploying
