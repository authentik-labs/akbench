apiVersion: bench.goauthentik.io/v1alpha1
kind: TestCase
metadata:
  labels:
    app.kubernetes.io/name: authentik-bench
    app.kubernetes.io/managed-by: kustomize
  name: main-vs-release
spec:
  # A parent: creates main-vs-release-{main,release}-{login,oauth-oidc}
  # deployments and main-vs-release-{login,oauth-oidc} child test cases.
  templates:
    - login
    - oauth-oidc
  variants:
    - name: main
      image: ghcr.io/goauthentik/dev-server
      tag: gh-main
    - name: release
      image: ghcr.io/goauthentik/server
      tag: "2026.6.0"
  baselineVariant: release
  deployment:
    clusterRef:
      name: workloadcluster-sample
    namespace: ignored
    server:
      replicas: 2
    worker:
      replicas: 1
    postgres:
      mode: Embedded
  profile: Burn
  vus: 8
