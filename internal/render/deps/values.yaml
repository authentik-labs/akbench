# Not real chart values: the pinned container images the operator runs on
# workload clusters, embedded by internal/render/deps.go. Kept in the
# image.repository/image.tag shape so Dependabot's helm ecosystem
# (.github/dependabot.yml) keeps the tags current.

# k6 must stay >=0.57.0: login.ts uses TypeScript syntax, which k6 only
# transpiles natively from that version on.
k6:
  image:
    repository: grafana/k6
    tag: 0.57.0

oidcTestClient:
  image:
    repository: ghcr.io/beryju/oidc-test-client
    tag: 2.7.1

samlTestSP:
  image:
    repository: ghcr.io/beryju/saml-test-sp
    tag: "1.4"

samlTestIdP:
  image:
    repository: ghcr.io/beryju/saml-test-idp
    tag: "0.11"

dex:
  image:
    repository: ghcr.io/dexidp/dex
    tag: v2.46.0

# Matches the authentik chart's default postgresql.image so the psql client
# speaks the server's protocol version; Dependabot ignores majors for it.
postgresRoleFix:
  image:
    repository: docker.io/library/postgres
    tag: 17.11-bookworm
